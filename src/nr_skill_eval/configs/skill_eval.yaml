# skill_eval run config
#
# This file is loaded by ``nr-skill-eval run`` when ``--config`` is not passed.
# It carries working defaults for everything EXCEPT the dataset bindings
# (manifest path, PDF directories) and the skill under test, which must be
# supplied by the user.
#
# Recommended workflow:
#   1. Copy this file next to your dataset checkout:
#        cp src/nr_skill_eval/configs/skill_eval.yaml ~/path/to/datasets/skill_eval.yaml
#   2. Fill in ``eval_manifest_path``, ``pdf_dirs``, ``skill_source_dir``
#      (and ``testdata_prefixes`` if your manifest hard-codes dataset paths
#      in user-facing text).
#   3. Run:
#        nr-skill-eval run --config ~/path/to/datasets/skill_eval.yaml

# ---------------------------------------------------------------------------
# REQUIRED — agent-eval manifest
# ---------------------------------------------------------------------------
# Absolute or ~-expanded path to a JSON list. Each entry must contain:
#   - original_query             (str)
#   - sdg_prompt_candidates      ({candidates: [{variant_id, prompt}, ...]})
#   - sdg_prompt_validation      ({selected_variant_id: int}, optional)
#   - relevant_pages             ([{doc_id, page_number_in_doc, score}, ...])
#   - answer                     (str — ground-truth answer)
#   - domain                     (str — joins to ``pdf_dirs`` below)
#   - prompt_taxonomy.domain_label  (str — used in the setup-turn prompt)
# See ``dataset.py:load_eval_manifest`` for the full schema.
#
# Leaving this null causes the CLI to exit with a clear error.
eval_manifest_path: null

# ---------------------------------------------------------------------------
# REQUIRED — per-domain PDF roots
# ---------------------------------------------------------------------------
# Keys MUST match the ``domain`` field on each manifest entry. Each value is
# a directory holding that domain's PDFs; the runner symlinks every ``*.pdf``
# inside into the trial workdir's ``./pdfs/``.
#
# Example:
#   pdf_dirs:
#     my_domain_a: ~/datasets/domain_a/pdfs
#     my_domain_b: ~/datasets/domain_b/pdfs
pdf_dirs: {}

# ---------------------------------------------------------------------------
# REQUIRED — skill under test
# ---------------------------------------------------------------------------
# Path to the Claude Code skill directory (the folder that contains
# ``SKILL.md`` and any ``references/`` subdir). The runner copies this into
# each c2/c3 trial workdir's ``.claude/skills/<skill-name>/``.
#
# Example:
#   skill_source_dir: ~/code/myproject/.claude/skills/my-skill
skill_source_dir: null

# ---------------------------------------------------------------------------
# OPTIONAL — path-prefix rewrites for paraphrased prompts
# ---------------------------------------------------------------------------
# Some manifests' paraphrased prompts hard-code dataset-source paths in the
# user-facing text (e.g. "...the PDFs at test-data/.../pdfs/"). Each prefix
# listed here is rewritten to ``./pdfs`` before the prompt is sent to the
# agent, so the symlink farm resolves correctly. Leave empty if your manifest
# already uses relative paths.
testdata_prefixes: []

# ---------------------------------------------------------------------------
# Agent model and per-trial limits
# ---------------------------------------------------------------------------
agent_model: claude-opus-4-7
per_trial_budget_usd: 5.0
per_trial_timeout_s: 600
per_trial_workdir_root: /tmp/skill_eval

# ---------------------------------------------------------------------------
# Conditions to run, in execution order
# ---------------------------------------------------------------------------
# Each (condition, domain) workdir is deleted after it finishes, so only one
# LanceDB is on disk at a time. Override on the CLI with ``--conditions``.
conditions:
  - c1_base               # skill blocked → off-the-shelf baseline
  - c2_retriever          # skill available, NL prompt, description-based auto-discovery
  - c3_retriever_skill    # skill available, explicit slash-command invocation

# ---------------------------------------------------------------------------
# LLM-as-judge
# ---------------------------------------------------------------------------
# Scores each query turn's ``final_answer`` against the manifest's ``answer``
# on a 1-5 scale. Requires the ``[llm]`` extra installed AND ``api_key_env``
# populated in the environment; otherwise skipped silently with a console
# note. Set ``enabled: false`` to opt out explicitly.
judge:
  enabled: true
  model: nvidia_nim/mistralai/mixtral-8x22b-instruct-v0.1
  api_base: https://integrate.api.nvidia.com/v1
  api_key_env: NVIDIA_API_KEY

# ---------------------------------------------------------------------------
# Tool-use summarizer
# ---------------------------------------------------------------------------
# After each (condition, domain) session, the harness reads the Claude Code
# session JSONL and asks a strong Anthropic model to narrate what tools the
# agent called and what strategy it took. Result is stamped onto the setup-
# turn TrialResult and rendered as a "Tool-use summaries" section in
# session_summary.md.
#
# Shells out to ``claude --print`` so it reuses Claude Code's existing auth
# (subscription/OAuth) — no extra API key needed. Decoupled from the judge on
# purpose: this fires only once per session (~3× per run), so a stronger
# narrator (Claude Opus by default) is cheap enough, while judging stays on
# its own deterministic model above.
summarizer:
  enabled: true
  model: claude-opus-4-7
