# skill_eval run config
#
# This file is loaded by ``skill-eval run`` when ``--config`` is not passed.
# It carries working defaults for everything EXCEPT the dataset bindings
# (manifest path, PDF directories), which must be supplied by the user.
#
# Recommended workflow:
#   1. Copy this file next to your dataset checkout:
#        cp src/skill_eval/configs/skill_eval.yaml ~/path/to/datasets/skill_eval.yaml
#   2. Fill in ``eval_manifest_path``, ``pdf_dirs`` (and ``testdata_prefixes``
#      if your manifest hard-codes dataset paths in user-facing text).
#   3. Run:
#        skill-eval run --config ~/path/to/datasets/skill_eval.yaml

# ---------------------------------------------------------------------------
# REQUIRED — agent-eval manifest
# ---------------------------------------------------------------------------
# Absolute or ~-expanded path to a JSON list. Each entry must contain:
#   - original_query             (str)
#   - sdg_prompt_candidates      ({candidates: [{variant_id, prompt}, ...]})
#   - sdg_prompt_validation      ({selected_variant_id: int}, optional)
#   - relevant_pages             ([{doc_id, page_number_in_doc, score}, ...])
#   - answer                     (str — ground-truth answer)
#   - domain                     (str — joins to ``pdf_dirs`` below)
#   - prompt_taxonomy.domain_label  (str — used in the setup-turn prompt)
# See ``dataset.py:load_eval_manifest`` for the full schema.
#
# Leaving this null causes the CLI to exit with a clear error.
eval_manifest_path: null

# ---------------------------------------------------------------------------
# REQUIRED — per-domain PDF roots
# ---------------------------------------------------------------------------
# Keys MUST match the ``domain`` field on each manifest entry. Each value is
# a directory holding that domain's PDFs; the runner symlinks every ``*.pdf``
# inside into the trial workdir's ``./pdfs/``.
#
# Example:
#   pdf_dirs:
#     my_domain_a: ~/datasets/domain_a/pdfs
#     my_domain_b: ~/datasets/domain_b/pdfs
pdf_dirs: {}

# ---------------------------------------------------------------------------
# OPTIONAL — path-prefix rewrites for paraphrased prompts
# ---------------------------------------------------------------------------
# Some manifests' paraphrased prompts hard-code dataset-source paths in the
# user-facing text (e.g. "...the PDFs at test-data/.../pdfs/"). Each prefix
# listed here is rewritten to ``./pdfs`` before the prompt is sent to the
# agent, so the symlink farm resolves correctly. Leave empty if your manifest
# already uses relative paths.
testdata_prefixes: []

# ---------------------------------------------------------------------------
# Agent selection, model, and per-trial limits
# ---------------------------------------------------------------------------
agent: claude
agent_models:
  claude: claude-opus-4-7
  codex: gpt-5.5
per_trial_budget_usd: 5.0
per_trial_timeout_s: 600
per_trial_workdir_root: /tmp/skill_eval

# ---------------------------------------------------------------------------
# LLM-as-judge
# ---------------------------------------------------------------------------
# Scores each query turn's ``final_answer`` against the manifest's ``answer``
# on a 1-5 scale. Requires the ``[llm]`` extra installed AND ``api_key_env``
# populated in the environment; otherwise skipped silently with a console
# note. Set ``enabled: false`` to opt out explicitly.
#
# Keep this on a stable, deterministic model so scores stay comparable across
# runs. Judging fires once per query × domain, so cheap matters.
#
# API key note: ``api_base: https://inference-api.nvidia.com/v1`` requires a
# key from inference.nvidia.com — these start with ``sk-***``. This is NOT
# the same as a build.nvidia.com key (those start with ``nvapi-***`` and
# target ``integrate.api.nvidia.com``). Using the wrong key against the wrong
# endpoint returns 401. Both can live in ``NVIDIA_API_KEY``; just make sure
# the value you export matches the ``api_base`` below.
judge:
  enabled: true
  model: openai/nvidia/nvidia/llama-3.3-nemotron-super-49b-v1.5
  api_base: https://inference-api.nvidia.com/v1
  api_key_env: NVIDIA_API_KEY
  # Nemotron Super is a reasoning model that emits a <think> block before the
  # final JSON, so it needs a large token budget. NVIDIA's evaluator tutorial
  # uses 32768 for the same model.
  max_tokens: 32768
  # Low/zero temperature keeps scoring reproducible across runs.
  temperature: 0.0

# ---------------------------------------------------------------------------
# Tool-use summarizer
# ---------------------------------------------------------------------------
# After each domain session, the harness reads the agent session JSONL and asks
# a strong Anthropic model to narrate what tools the agent called and what
# strategy it took. Result is stamped onto the setup-turn TrialResult and
# rendered as a "Tool-use summaries" section in session_summary.md.
#
# Shells out to ``claude --print`` so it reuses Claude Code's existing auth
# (subscription/OAuth) — no extra API key needed. Decoupled from the judge on
# purpose: this fires only once per session, so a stronger narrator (Claude
# Opus by default) is cheap enough, while judging stays on its own
# deterministic model above.
summarizer:
  enabled: true
  model: claude-opus-4-7
