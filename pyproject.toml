[build-system]
requires = ["setuptools>=78.1.1", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-retriever-skill-eval"
version = "0.1.0"
description = "Agent-skill evaluation harness: benchmarks a Claude Code skill against an off-the-shelf baseline on a labelled QA manifest."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "NVIDIA Corporation" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "typer>=0.12.0",
  "pyyaml>=6.0",
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
# LLM-as-judge support (litellm-backed). The harness runs without it; judge
# scoring is skipped silently if litellm is unavailable or the API key env var
# is unset.
llm = [
  "litellm>=1.50.0",
]

[project.scripts]
nr-skill-eval = "nr_skill_eval.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nr_skill_eval = ["configs/*.yaml", "prompts/*.j2"]
