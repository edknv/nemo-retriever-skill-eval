# Your local skill_eval config — DO NOT commit to the codebase.                                                                                                                                     
# Save at ~/git/retriever-sdg-v3/skill_eval.yaml (or anywhere outside the repo).                                                                                                                    
                                                                                                                                                                                                    
# REQUIRED — agent-eval manifest
eval_manifest_path: ~/git/retriever-sdg-v3/runs/vidore_v3_agent_evals_20260514_batch_2/agent_scenario_manifest.json
                                                                                                                                                                                                    
# REQUIRED — per-domain PDF roots (keys match manifest's `domain` field)                                                                                                                            
pdf_dirs:
  vidore_v3_pharmaceuticals: ~/git/retriever-sdg-v3/test-data/vidorev3-fda/pdfs
  vidore_v3_finance_en: ~/git/retriever-sdg-v3/test-data/vidorev3-finance/pdfs
  vidore_v3_hr: ~/git/retriever-sdg-v3/test-data/vidorev3-hr/pdfs

# Rewrites these substrings to ./pdfs in paraphrased prompts so the
# in-trial symlink farm resolves.
testdata_prefixes:
  - test-data/vidorev3-fda/pdfs
  - test-data/vidorev3-finance/pdfs
  - test-data/vidorev3-hr/pdfs

# Agent selection, model, and per-trial limits
agent: codex
agent_models:
  claude: claude-opus-4-7
  codex: gpt-5.5
per_trial_budget_usd: 5.0
per_trial_timeout_s: 900
per_trial_workdir_root: /tmp/skill_eval

# LLM-as-judge — requires `litellm` installed and NVIDIA_API_KEY in env
judge:
  enabled: true
  model: nvidia_nim/mistralai/mixtral-8x22b-instruct-v0.1
  api_base: https://integrate.api.nvidia.com/v1
  api_key_env: NVIDIA_API_KEY
