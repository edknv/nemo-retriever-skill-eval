# Your local skill_eval config — DO NOT commit to the codebase.                                                                                                                                     
# Save at ~/git/retriever-sdg-v3/skill_eval.yaml (or anywhere outside the repo).                                                                                                                    
                                                                                                                                                                                                    
# REQUIRED — agent-eval manifest
eval_manifest_path: /data/runs/vidore_v3_agent_evals_20260514_batch_2/agent_scenario_manifest.json
                                                                                                                                                                                                    
# REQUIRED — per-domain PDF roots (keys match manifest's `domain` field)                                                                                                                            
pdf_dirs:
  vidore_v3_pharmaceuticals: /data/test-data/vidorev3-fda/pdfs
  vidore_v3_finance_en: /data/test-data/vidorev3-finance/pdfs
  vidore_v3_hr: /data/test-data/vidorev3-hr/pdfs

# Rewrites these substrings to ./pdfs in paraphrased prompts so the
# in-trial symlink farm resolves.
testdata_prefixes:
  - test-data/vidorev3-fda/pdfs
  - test-data/vidorev3-finance/pdfs
  - test-data/vidorev3-hr/pdfs

# Rename ./pdfs/ symlinks to opaque doc_<sha1[:10]>.pdf so the agent
# cannot grep query terms out of filenames. Real doc_ids still appear
# in trial JSON; a per-domain doc_id_mapping.json is written for debugging.
anonymize_filenames: true

# Agent selection, model, and per-trial limits
agent: codex
agent_models:
  claude: claude-opus-4-7
  codex: gpt-5.5
per_trial_budget_usd: 5.0
per_trial_timeout_s: 900
per_trial_workdir_root: /tmp/skill_eval

# LLM-as-judge — requires `litellm` installed and NVIDIA_API_KEY in env
judge:
  enabled: true
  model: openai/nvidia/nvidia/llama-3.3-nemotron-super-49b-v1.5
  api_base: https://inference-api.nvidia.com/v1
  api_key_env: NVIDIA_API_KEY
  max_tokens: 32768
  temperature: 0.0
